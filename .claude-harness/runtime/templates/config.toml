# Claude_Harness project configuration.
version = 1

# Documents written by the harness.
[docs]
root = "docs"       # folder for all harness documents, relative to the project root
language = "en"     # ISO 639-1 language of generated documents

# Modules: true = active, false = inactive. Unlisted modules are inactive.
[modules]
todo = true
daily = false
techdocs = true
development = true
semver = false

# Backlog folder, relative to docs.root. backend: "api" = the AI works through
# the ToDo-Viewer's HTTP API at api_url (the server checks format and rules);
# "files" = the AI edits the Markdown files directly and a hook checks them.
# With "api" the AI never touches TODO.md, archive.md or items/, and they are
# not required (the server may keep the backlog in its database). Notes and
# topics (reminders, questions, ideas) belong to this module too; they live in
# the ToDo-Viewer's database, never in files, and exist only with "api".
[todo]
path = "todo"
backend = "api"
api_url = "http://localhost:5411/api"

# Daily development reports, relative to docs.root.
[daily]
path = "daily"

# Technical documentation, relative to docs.root. README.md in the project
# root always belongs to it. Known documents: architecture, interfaces,
# configuration, operations (file name: <document>.md).
[techdocs]
path = "techdocs"
documents = ["architecture", "interfaces", "configuration"]

# Development suite: binding rules for the AI, always in English, relative to
# docs.root. Parts are active while the suite is active unless set to false.
# Known parts: architecture (rules in <path>/architecture.md), decomposition
# (splitting work into small, separately testable steps), worktree (changes
# with an approved plan run in a worktree and are merged back by the AI),
# testing (where tests live and how the test folder is structured). tests: the
# test folder relative to the project root, next to the source folder.
[development]
path = "development"
architecture = true
decomposition = true
worktree = true
testing = true
tests = "tests"

# Release versions (SemVer). file: version file relative to docs.root, holding
# only MAJOR.MINOR.PATCH. sync: files relative to the project root that must
# contain the same version (e.g. "package.json", "Cargo.toml"). paths: what
# belongs to the released product; only commits there count as unreleased.
[semver]
file = "VERSION"
sync = []
paths = ["."]

# Cloud sessions (claude.ai/code) load the repository but not the plugin. With
# export = true the project holds a copy of the plugin (skills, scripts, hooks)
# that /claude-harness:init and /claude-harness:update create and keep current;
# it must be committed. Root project only.
[cloud]
export = false

# Claude_Harness repository, one path per machine (absolute or starting with
# "~"). The first path that exists here is used to hand harness wishes over to
# its backlog. Optional.
[harness]
repo = []
