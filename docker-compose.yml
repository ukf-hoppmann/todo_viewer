services:
  todo-viewer:
    build: .
    container_name: todo-viewer
    hostname: todo.localhost
    restart: unless-stopped
    environment:
      # Startordner des Dateibrowsers beim Hinzufügen von Projekten
      - BROWSE_START=/Users/hoppmann/Documents/GitHub
      # Log in das per Volume eingebundene ./logs (rotiert: 5 × 5 MB)
      - LOG_FILE=/app/logs/todo-viewer.log
      - LOG_LEVEL=INFO
    ports:
      # Nur lokal erreichbar: die API kann Items anlegen, ändern und löschen.
      - "127.0.0.1:5412:5411"
    volumes:
      # config.json + UI-Zustand (ui_state.json) liegen hier beschreibbar auf
      # dem Host und überleben damit "docker compose down" bzw. Rebuilds.
      - ./configs:/app/configs
      # Logdateien auf dem Host; bleiben beim Entfernen des Containers erhalten.
      - ./logs:/app/logs
      # gleicher absoluter Pfad wie auf dem Host, damit die in config.json
      # referenzierten Backlog-Ordner in den Nachbar-Repos gefunden werden.
      # Beschreibbar, damit Status-/Prioritätsänderungen und Archivierung
      # aus der UI in den Dateien landen.
      - /Users/hoppmann/Documents/GitHub:/Users/hoppmann/Documents/GitHub

  # Der Neubau (EPIC-007) liegt auf Host-Port 5411 (der Harness sucht dort), der alte Viewer auf 5412.
  # Im Container hört der Neubau weiter auf 5412, der alte auf 5411.
  todo-viewer-next:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: todo-viewer-next
    restart: unless-stopped
    environment:
      # Startordner des Dateibrowsers beim Hinzufügen von Projekten
      - BROWSE_START=/Users/hoppmann/Documents/GitHub
    ports:
      # Nur lokal erreichbar: die API und MCP können alles ändern.
      - "127.0.0.1:5411:5412"
    volumes:
      # viewer.db, Backups (configs/backups) und die Konfiguration; die alte todo.db liegt daneben und bleibt unberührt.
      - ./configs:/app/configs
      # viewer.log (JSON-Zeilen, rotiert)
      - ./logs:/app/logs
      # gleicher absoluter Pfad wie auf dem Host, damit die Spiegel-Ordner der Projekte gefunden werden
      - /Users/hoppmann/Documents/GitHub:/Users/hoppmann/Documents/GitHub

# Aufruf im Browser: http://todo.localhost:5412 (alter Viewer)
# (*.localhost wird von macOS ohne /etc/hosts-Eintrag automatisch auf
# 127.0.0.1 aufgelöst; Port 80 ist auf dieser Maschine bereits belegt)
# Neubau: http://localhost:5411 (API unter /api, MCP unter /mcp)
