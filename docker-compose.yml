services:
  # Der Viewer liegt auf Host-Port 5411 (der Harness sucht dort). Host- und Container-Port sind gleich.
  todo-viewer-next:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: todo-viewer-next
    restart: unless-stopped
    environment:
      # Startordner des Dateibrowsers beim Hinzufügen von Projekten
      - BROWSE_START=/Users/hoppmann/Documents/GitHub
      # Zeitzone des Rechners (Architektur §4): Serientermine der Wecker werden in ihr gerechnet. todo.sh gibt die
      # Zone des Macs weiter; ohne sie gilt Europe/Berlin.
      - TZ=${TZ:-Europe/Berlin}
    ports:
      # Nur lokal erreichbar: die API und MCP können alles ändern.
      - "127.0.0.1:5411:5411"
    volumes:
      # viewer.db, Backups (configs/backups) und die Konfiguration; die alte todo.db liegt daneben und bleibt unberührt.
      - ./configs:/app/configs
      # viewer.log (JSON-Zeilen, rotiert)
      - ./logs:/app/logs
      # gleicher absoluter Pfad wie auf dem Host, damit die Spiegel-Ordner der Projekte gefunden werden
      - /Users/hoppmann/Documents/GitHub:/Users/hoppmann/Documents/GitHub

  # Reverse-Proxy, damit der Neubau ohne Port unter http://todo.localhost erreichbar ist.
  todo-proxy:
    image: nginx:1.27-alpine
    container_name: todo-proxy
    restart: unless-stopped
    depends_on:
      - todo-viewer-next
    ports:
      # Nur lokal erreichbar, wie der Viewer selbst. Port 80 gehört my_story_game (Port-Übersicht: Misc, NOTE-001).
      - "127.0.0.1:5413:80"
    volumes:
      - ./nginx/todo.localhost.conf:/etc/nginx/conf.d/default.conf:ro

# Aufruf im Browser:
#   Neubau:        http://todo.localhost:5413 (über todo-proxy) oder direkt http://localhost:5411 (API unter /api, MCP unter /mcp)
#   alter Viewer:  http://todo.localhost:5412
# (*.localhost wird von macOS ohne /etc/hosts-Eintrag automatisch auf 127.0.0.1 aufgelöst)
