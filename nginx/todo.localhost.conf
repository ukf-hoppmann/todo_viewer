# Reverse-Proxy für den Neubau: http://todo.localhost:5413 → todo-viewer-next:5411.
# Der Port ist in docker-compose.yml nur an 127.0.0.1 gebunden (Architektur §3: nur lokal erreichbar).

server {
    listen 80;
    server_name todo.localhost;

    # Docker-DNS; mit einer Variable in proxy_pass löst nginx den Namen neu auf, wenn der Viewer-Container
    # nach einem Neustart eine andere IP hat.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $viewer http://todo-viewer-next:5411;

    client_max_body_size 50m;

    location / {
        proxy_pass $viewer;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";

        # Server-Sent Events (/api/core/events) und MCP-Streams (/mcp) sofort durchreichen und lange offen halten.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }
}

# Andere Hostnamen (z. B. http://localhost:5413) werden nicht bedient.
server {
    listen 80 default_server;
    return 444;
}
