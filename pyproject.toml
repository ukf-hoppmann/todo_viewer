[tool.pytest.ini_options]
pythonpath = ["src_old/backend"]
testpaths = ["src_old/backend/tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src_old/backend"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src_old/backend"
explicit_package_bases = true
ignore_missing_imports = true

[tool.importlinter]
root_package = "todo_viewer"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Onion layers: dependencies point inwards"
type = "layers"
layers = [
    "todo_viewer.bootstrap",
    "todo_viewer.api | todo_viewer.infrastructure",
    "todo_viewer.application",
    "todo_viewer.domain",
]

[[tool.importlinter.contracts]]
name = "Domain uses no third-party libraries"
type = "forbidden"
source_modules = ["todo_viewer.domain", "todo_viewer.application"]
forbidden_modules = ["fastapi", "pydantic", "starlette", "uvicorn", "sqlalchemy"]

[[tool.importlinter.contracts]]
name = "Storage adapters do not import each other"
type = "independence"
modules = [
    "todo_viewer.infrastructure.markdown",
    "todo_viewer.infrastructure.database",
    "todo_viewer.infrastructure.notes_files",
]

[[tool.importlinter.contracts]]
name = "The markdown adapter knows nothing about notes"
type = "forbidden"
source_modules = ["todo_viewer.infrastructure.markdown"]
forbidden_modules = ["todo_viewer.domain.notes", "todo_viewer.application.services.notes"]
